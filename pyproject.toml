[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "colorstream"
version = "0.1.0"
description = "Real-time AI colorization of black and white film for Stremio and the command line"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "onnxruntime>=1.17",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "PyYAML>=6.0",
  "tqdm>=4.66",
]

[project.scripts]
colorstream = "colorstream.cli:main"

[tool.setuptools]
packages = ["colorstream", "colorstream.models"]

[tool.setuptools.package-data]
colorstream = ["dashboard/*.html"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
